<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Tszching (Phoebe) Wang — Product Manager, Data Analyst & AI Builder. Northwestern MSIT '26, Chicago. Open to 2026 new-grad PM, data, and AI product roles." />
    <link rel="canonical" href="https://phoebewong214.github.io/portfilo/" />
    <title>Phoebe Wang — PM · Data · AI</title>

    <!-- 分享卡片。og:image 必须是绝对地址，相对路径在 LinkedIn/Slack 上不会生效。
         ⚠️ 如果以后仓库改名，下面 3 个绝对 URL 要一起改。
         图片由 tools/og-template.html 渲染而来（见该文件顶部注释）。 -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Phoebe Wang · Portfolio" />
    <meta property="og:url" content="https://phoebewong214.github.io/portfilo/" />
    <meta property="og:title" content="Phoebe Wang — PM · Data · AI" />
    <meta property="og:description" content="Building AI-powered products that turn data into decisions people actually adopt. Northwestern MSIT '26 · Open to Work." />
    <meta property="og:image" content="https://phoebewong214.github.io/portfilo/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tszching (Phoebe) Wang — Product, Data, AI. Northwestern MSIT '26, Chicago, IL. Open to work." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Phoebe Wang — PM · Data · AI" />
    <meta name="twitter:description" content="Building AI-powered products that turn data into decisions people actually adopt." />
    <meta name="twitter:image" content="https://phoebewong214.github.io/portfilo/og.jpg" />

    <!-- 主题必须在首帧渲染前定好，否则深色偏好的用户会先闪一下白屏。
         优先级：用户手动选过的 > 系统偏好 > 深色。 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pw-theme');
          var manual = localStorage.getItem('pw-theme-manual');
          var theme =
            manual && stored
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- 字体原本是在 JS 注入的 <style> 里用 @import 引的，会等 JS 执行完才开始下载。
         提前 preconnect + link 让字体和 JS 并行加载。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
